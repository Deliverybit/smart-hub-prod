# Private snapshot API and the continuous screener worker. Not the public site.
services:
  - type: web
    name: scoop52-snapshot-api
    runtime: python
    plan: starter
    numInstances: 2
    buildCommand: pip install -r requirements.txt
    startCommand: python snapshot_api.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
  - type: worker
    name: scoop52-screener-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python admin_tools/screener_worker.py --loop
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
