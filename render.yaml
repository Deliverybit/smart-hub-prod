# Private snapshot API. Two always-on instances. Not the public site.
# Continuous scans run on the existing worker scoop52-snapshot-worker.
# The polarity cron reads the published boards and prints headlines the
# phrase lists did not score. It does not edit the dictionary.
services:
  - type: web
    name: scoop52-snapshot-api
    runtime: python
    plan: starter
    numInstances: 2
    buildCommand: pip install -r requirements.txt
    startCommand: python snapshot_api.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: EODHD_API_KEY
        sync: false

  - type: cron
    name: scoop52-polarity-review
    runtime: python
    plan: starter
    schedule: "30 11 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python admin_tools/review_headline_polarity.py

  # One cron, the existing scoop52-x-posts service. Weekday mornings only.
  # 13:00–15:30 UTC is 7:00–9:30 AM Central standard time. Runs on the hour and
  # half hour; the script posts the one market whose slot is open.
  # Daylight time shifts the window to 8:00–10:30 AM Central.
  - type: cron
    name: scoop52-x-posts
    runtime: python
    plan: starter
    schedule: "0,30 13-15 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python admin_tools/post_screen.py --due --send
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
